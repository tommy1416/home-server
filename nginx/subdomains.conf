# Subdomain-based reverse proxy configuration
# Each service gets its own server_name for clean URLs
# 
# Backward compatibility with path-based routing is preserved
# in nextcloud.conf and services.conf

# ---- Nextcloud ----
server {
    server_name nextcloud.tdemers.duckdns.org;

    client_max_body_size 10G;
    proxy_read_timeout 3600;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tdemers.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdemers.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ---- Pi-hole (LAN only) ----
server {
    server_name pihole.tdemers.duckdns.org;

    allow 192.168.0.0/24;
    deny all;

    location / {
        proxy_pass http://10.88.0.3:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tdemers.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdemers.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ---- Netdata (LAN only) ----
server {
    server_name netdata.tdemers.duckdns.org;

    allow 192.168.0.0/24;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:19999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
