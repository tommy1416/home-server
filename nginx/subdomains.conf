# ---- Copilot ----
server {
    server_name copilot.tdemers.duckdns.org;

    location / {
        alias /srv/local-copilot/;
        index index.html;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tdemers.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdemers.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ---- Clipboard ----
server {
    server_name clipboard.tdemers.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:5555/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /clipboard/;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tdemers.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tdemers.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
