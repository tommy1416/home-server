# See smb.conf.example for a more detailed config file or
# read the smb.conf manpage.
# Run 'testparm' to verify the config is correct after
# you modified it.
#
# Note:
# SMB1 is disabled by default. This means clients without support for SMB2 or
# SMB3 are no longer able to connect to smbd (by default).

[global]
        workgroup = SAMBA
        security = user
        interfaces = 127.0.0.1 192.168.0.31
        bind interfaces only = yes

        passdb backend = tdbsam

        printing = cups
        printcap name = cups
        load printers = yes
        cups options = raw

        # Install samba-usershares package for support
        include = /etc/samba/usershares.conf

[homes]
        comment = Home Directories
        valid users = %S, %D%w%S
        browseable = No
        read only = No
        inherit acls = Yes

[printers]
        comment = All Printers
        path = /var/tmp
        printable = Yes
        create mask = 0600
        browseable = No

[print$]
        comment = Printer Drivers
        path = /var/lib/samba/drivers
        # printadmin is a local group
        write list = printadmin root
        force group = printadmin
        create mask = 0664
        directory mask = 0775

[movies]
        comment = Movies
        path = /mnt/storage/Movies
        valid users = tdemers
        read only = No
        browseable = Yes
        create mask = 0664
        directory mask = 0775

[storage]
        comment = Shared Storage
        path = /mnt/storage
        valid users = tdemers
        read only = No
        browseable = Yes
        create mask = 0664
        directory mask = 0775
        hide dot files = yes
        veto files = /$RECYCLE.BIN/MSOCache/System Volume Information/Recovery/desktop.ini/
        delete veto files = no
